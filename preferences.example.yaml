# Personal job-search preferences — copy to run_dir/preferences.yaml and edit.
#
# run_dir/ is gitignored, so nothing personal about you ends up in version control. This example
# file IS tracked, so keep it generic: placeholder values only, never your real situation.
#
# Every field is optional. Omitted fields fall back to the neutral defaults in preferences.py,
# which apply no gate at all — an unconfigured run searches without a location filter and rejects
# nothing on work authorization, language, or education.

# Directory where you save job-posting PDFs out of your browser — the SOURCE the agent moves
# files out of. On every startup it categorizes uncategorized PDFs here with a `cat-<category>-`
# prefix, then moves the `cat-saved_jd-*.pdf` ones into the applied-jobs corpus. `~` is expanded.
#
# This is NOT the corpus itself. The destination is always run_dir/applied_jobs/ and is not
# configurable — do not point save_dir at it, or ingest would be moving files onto themselves.
save_dir: ~/Downloads

# Regions to search on LinkedIn. Each entry becomes one search per query.
#
# `linkedin_location` is TYPED INTO the location filter chip's autocomplete, the same way a person
# would set it. Filters are never applied by crafting `geoId=`/`f_TPR=` URLs — hand-assembled
# filter parameters are a cheap fingerprint for anti-automation.
#
# `geo_id` is optional. It is the id LinkedIn puts in the URL once the autocomplete suggestion is
# picked (European Union = 91000000), and is used ONLY to confirm afterwards that the click
# actually applied. Leave it out and the region is still searched; you just lose that check.
# An empty list searches globally.
search_regions:
  - name: Example Country
    linkedin_location: Example Country
    geo_id: '000000'

# Places (written properly — 'Germany', not 'germany') where you would need
# visa sponsorship. A job there that does not explicitly offer sponsorship is auto-rated 1.
# Leave empty if you are authorized everywhere you search.
sponsorship_required_in: []

# Languages you can work in, lowercase. This list drives three separate rules, all of them off
# while it is empty:
#   1. A posting that explicitly REQUIRES another language is auto-rated 1 (hard rule).
#   2. A posting WRITTEN IN another language is capped at `foreign_language_rating_cap` below.
#   3. A job whose location IMPLIES a different working language (English JD in Montreal or
#      Madrid) gets a warning — never a rejection. That language comes from the location alone,
#      via the cached geography classifier; the posting is never asked about it.
languages:
  - english

# Highest rating a posting written in a language outside `languages` can receive. Like the hybrid
# cap this is a ceiling, not a rejection: the job is still saved and auditable, it just cannot
# reach the notification threshold of 4.
foreign_language_rating_cap: 3

# Degree levels that auto-reject when a posting states them as a HARD requirement.
# Valid values: master, phd. Leave empty if an advanced degree is not a blocker for you.
# Note: only hard requirements reject — "MSc preferred" or "Master's or equivalent experience"
# never does.
reject_required_degrees: []

# WHERE A ROLE MAY BE ANCHORED, as three lists — plus a fourth for a different question.
#
#   would_live_here      places you WOULD live. Exempts a posting from the geographic gate.
#   would_not_live_here  places you would NOT. Rejects.
#   not_yet_bucketed     the agent's guesses, awaiting your decision. GATES NOTHING.
#   would_commute_here   places you would travel to an OFFICE. Drives the hybrid/on-site cap only.
#
# Anything none of the first three names is guessed at ONCE by a cheap LLM call, appended to
# `not_yet_bucketed` with its guess as a comment, and reported to you on Telegram. **A guess never
# rejects a job** — the posting is still rated and shown, just flagged — because you correct a
# guess by looking at it, and you cannot look at a job you were never shown. Move each line up
# into one of the two real lists to turn it into a rule.
#
# WHY COMMUTING IS A SEPARATE LIST. Living somewhere is not the same as travelling across it. One
# list used to answer both questions, and because `Spain` was on it (somewhere you would live) an
# ON-SITE role in any Spanish town inherited the exemption and could score 5. The gate reads
# would_live_here + would_commute_here together, since commuting somewhere implies being there.
#
# WRITE PLACE NAMES THE WAY PLACES ARE WRITTEN. Matching is whole-word, case-SENSITIVE and
# accent-EXACT: `Málaga`, not `malaga`; `Nice`, not `nice`. You do not need every spelling — a
# posting saying `Torino` matches a list saying `Turin` through the cached classifier.
#
# A job is rejected only when EVERY country it names is on would_not_live_here, so "Spain or the
# Netherlands" survives, and so does an offer of a whole area. And these lists say where you would
# LIVE: a remote posting that does not pin you to its anchor country is judged on where you could
# actually be, not on where it was advertised.
locations:
  would_live_here: []
  would_not_live_here: []
  not_yet_bucketed: []
  would_commute_here: []

hybrid:
  # Highest rating a hybrid/on-site job OUTSIDE would_commute_here can reach. A ceiling, not a
  # rejection: the job is still saved and auditable, it just cannot reach the notification
  # threshold of 4. An office means uncompensated travel time and permanently living within reach
  # of it, so this is a real cost even where the role is good.
  rating_cap: 3

titles:
  # Free text appended to the query-generation prompt describing the kind of role you want.
  prefer: >-
    Prefer INDIVIDUAL CONTRIBUTOR titles (Principal / Staff / Lead / Senior engineer and
    scientist roles).
  # Title words that must never appear in a generated search query.
  exclude:
    - Manager
    - Head of
    - Director
    - VP

# Free text shown to the evaluator about relocation you would consider. Empty means the evaluator
# is given no relocation guidance and judges the role on its own merits.
relocation_note: ''

# The country you are tax-resident in today, written as a place name (e.g. Portugal). A posting
# that only requires residence in that country ("remote within Portugal") is then not flagged as
# a relocation; one naming a region or city inside it still is. Empty means every stated residence
# requirement is flagged.
current_tax_residence: ''

compensation:
  # Annual base pay you are targeting, and the ISO 4217 currency it is quoted in. When BOTH are set
  # and a posting states a complete annual range in that same currency, code decides the pay
  # question: the range is on target when its UPPER bound reaches base_target (the band is
  # negotiable), and a "Salary below target" warning is added only when the whole range sits
  # under it. Other currencies, hourly/day rates and partial figures stay with the rater.
  # Leave both empty for no code-side comparison.
  base_target:      # e.g. 150000
  currency: ''      # e.g. EUR

companies:
  # Companies to always auto-reject, whatever the posting says. Matched on an EXACT,
  # case-sensitive company name — 'acme' does not match 'Acme' — so list each variant a
  # company posts under. A name hit is then confirmed by one cheap LLM call, so a different
  # organization that happens to share the name is not rejected by mistake; if that call
  # cannot be made, the job is rejected on the name match alone.
  #
  # Also checked against the end client, so a recruiting agency reposting the role does not
  # get around it.
  #
  # `added` is required for an entry to expire. An entry stops rejecting 180 days after that
  # date and is then reported at WARNING and in the run audit log — renew it by bumping the
  # date, or delete it. An entry with no valid date stays active and is warned about.
  blacklist: []
  #   - name: Example Corp
  #     reason: bad Glassdoor reviews
  #     added: 2026-01-01

# ---------------------------------------------------------------------------
# run_dir/location_recommendations.yaml — written by the agent, ADVISORY ONLY
# ---------------------------------------------------------------------------
# Once per non-interactive run the agent checks the place lists above against the places it actually
# saw, and records any entry that looks wrong: one that sits inside another place (`Roma` inside
# `Romania`), or one that never matches but would with its case or accents fixed (`malaga` against
# postings that say `Málaga`). It is NEVER read as policy and it never edits this file.
#
# To act on a finding: fix the entry here yourself, then set `status: accepted` on it. To dismiss
# one: set `status: rejected`. Each finding is reported once, when it is first written, so an
# unread backlog does not warn on every run.
#
# Countries none of your lists name are handled separately: the agent's guess is appended to
# `locations.not_yet_bucketed` above, where you move it into would_live_here or would_not_live_here.
