# Personal job-search preferences — copy to run_dir/preferences.yaml and edit.
#
# run_dir/ is gitignored, so nothing personal about you ends up in version control. This example
# file IS tracked, so keep it generic: placeholder values only, never your real situation.
#
# Every field is optional. Omitted fields fall back to the neutral defaults in preferences.py,
# which apply no gate at all — an unconfigured run searches without a location filter and rejects
# nothing on work authorization, language, or education.

# Directory where you save job-posting PDFs out of your browser — the SOURCE the agent moves
# files out of. On every startup it categorizes uncategorized PDFs here with a `cat-<category>-`
# prefix, then moves the `cat-saved_jd-*.pdf` ones into the applied-jobs corpus. `~` is expanded.
#
# This is NOT the corpus itself. The destination is always run_dir/applied_jobs/ and is not
# configurable — do not point save_dir at it, or ingest would be moving files onto themselves.
save_dir: ~/Downloads

# Regions to search on LinkedIn. Each entry becomes one search per query.
#
# `linkedin_location` is TYPED INTO the location filter chip's autocomplete, the same way a person
# would set it. Filters are never applied by crafting `geoId=`/`f_TPR=` URLs — hand-assembled
# filter parameters are a cheap fingerprint for anti-automation.
#
# `geo_id` is optional. It is the id LinkedIn puts in the URL once the autocomplete suggestion is
# picked (European Union = 91000000), and is used ONLY to confirm afterwards that the click
# actually applied. Leave it out and the region is still searched; you just lose that check.
# An empty list searches globally.
search_regions:
  - name: Example Country
    linkedin_location: Example Country
    geo_id: '000000'

# Locations (lowercase, matched as whole words against the posting's location) where you would need
# visa sponsorship. A job there that does not explicitly offer sponsorship is auto-rated 1.
# Leave empty if you are authorized everywhere you search.
sponsorship_required_in: []

# Languages you can work in, lowercase. This list drives three separate rules, all of them off
# while it is empty:
#   1. A posting that explicitly REQUIRES another language is auto-rated 1 (hard rule).
#   2. A posting WRITTEN IN another language is capped at `foreign_language_rating_cap` below.
#   3. A job whose location has a different local working language (English JD in Montreal or
#      Madrid) gets a warning — never a rejection.
languages:
  - english

# Highest rating a posting written in a language outside `languages` can receive. Like the hybrid
# cap this is a ceiling, not a rejection: the job is still saved and auditable, it just cannot
# reach the notification threshold of 4.
foreign_language_rating_cap: 3

# Degree levels that auto-reject when a posting states them as a HARD requirement.
# Valid values: master, phd. Leave empty if an advanced degree is not a blocker for you.
# Note: only hard requirements reject — "MSc preferred" or "Master's or equivalent experience"
# never does.
reject_required_degrees: []

# WHERE A ROLE MAY BE ANCHORED. Purely geographic — this asks "is this a place I would be",
# and deliberately nothing about the language spoken there (that is `languages`, above, and the
# two must never be folded together: a rule keyed on "non-English" would exclude a French-language
# remote role in Canada).
#
# A bare location is NOT read as a residency requirement. "Germany (Remote)" means the role is
# anchored in Germany while you could live anywhere in the EU, so `location` and an explicit
# `relocation` statement in the JD are judged separately, against the same lists.
#
# Resolution is three-tier, cheapest first:
#   1. `hybrid.acceptable_locations` below exempts outright — so you can put `france` in `exclude`
#      and still keep Nice and Toulouse, by listing those cities there.
#   2. `exclude` rejects outright.
#   3. Anything neither list names goes to a cached LLM classifier (run_dir/location_cache.yaml),
#      which returns the country and one of: southern_europe, northern_europe, western_europe,
#      eastern_europe, north_america, other, unknown, plus every other name the place goes by.
#      Both lists are then re-checked against those names — that is what matches a posting saying
#      `Torino` against a list entry saying `Turin` — and `reject_regions` decides the rest.
#   4. ...except that for a REMOTE role the anchor is only judged when the posting actually pins
#      you to it. A remote job advertised in Romania may mean "live in Romania" or "live anywhere
#      in the EU", and those are opposite answers to the same location string. The extractor
#      captures which (`residency_scope`):
#        - the JD pins residence to the country ("Remote within country", "must be based in
#          Germany") -> the anchor is judged, as in tier 3
#        - the JD offers a whole area ("anywhere in the EU", "Work from Anywhere") -> kept
#        - the JD says nothing -> kept IF every country named is an EU member state, because an EU
#          anchor implies EU work rights while a UK, Serbian, Norwegian or Swiss one does not
#      Hybrid and on-site roles are NOT spared any of this: an office pins you to the office.
#      Neither is a stated `relocation`, which is the JD asserting a requirement outright.
# A job is rejected only when EVERY country named is in a rejected region, so "Spain or the
# Netherlands" passes; so does anything naming no country ("European Union", "Remote (EMEA)"), and
# so does a posting offering a whole multi-country area even when it names one country inside it.
# Classifier failure fails OPEN — an outage must not start rejecting jobs.
#
# BOTH lists empty means no geographic gate and, deliberately, not a single classifier call.
# To keep or drop ONE specific country, use `exclude` or `hybrid.acceptable_locations` — both are
# plain string matches. Do NOT try to do it by adjusting `reject_regions`: the classifier is
# phrasing-dependent at the margins (measured: "Dublin, Ireland" -> western_europe, bare "Ireland"
# -> northern_europe), so a country can sit in two different regions depending on how a posting
# writes it. Regions are for the coarse decision; the lists are for named exceptions.
locations:
  # Place names, written the way places are written — see the note on acceptable_locations below.
  exclude: []
  reject_regions: []

hybrid:
  # Highest rating a hybrid/on-site job outside `acceptable_locations` can receive. This is a
  # ceiling, not a rejection: the job is still saved and auditable, it just cannot reach the
  # notification threshold of 4.
  rating_cap: 3
  # Places where you would actually accept commuting to an office. List both countries and their
  # major cities. Empty caps every hybrid/on-site job.
  #
  # WRITE PLACE NAMES THE WAY PLACES ARE WRITTEN. Matching is whole-word, case-SENSITIVE and
  # accent-EXACT: `Málaga`, not `malaga`; `Nice`, not `nice`. Two reasons, both learned the hard
  # way:
  #   - `malaga` was an entry that could never match anything, because LinkedIn writes `Málaga`.
  #     It looked exactly like an entry that simply had not come up yet.
  #   - This list exempts OUTRIGHT, so a short lowercase entry that is a prefix of a country name
  #     used to switch the whole geographic gate off for that country before any other rule ran.
  #     `roma` (for Rome) matched `romania`, and every Romanian posting sailed through — one was
  #     rated 4 and notified.
  #
  # You do NOT need to list every spelling. Where a place has a different local and English name
  # the cached classifier resolves it (a posting saying `Torino` matches `Turin` here, `München`
  # matches `Munich`), so hand-maintained spelling pairs are optional — and it was exactly such a
  # hand-added pair that introduced `roma`. Listing both is still free and deterministic.
  #
  # The agent reports entries that never match, and entries that read as ambiguous, in
  # run_dir/location_recommendations.yaml.
  # This list does double duty: it is also tier 1 of the `locations` gate above, exempting a
  # REMOTE role anchored in one of these places.
  acceptable_locations: []

titles:
  # Free text appended to the query-generation prompt describing the kind of role you want.
  prefer: >-
    Prefer INDIVIDUAL CONTRIBUTOR titles (Principal / Staff / Lead / Senior engineer and
    scientist roles).
  # Title words that must never appear in a generated search query.
  exclude:
    - Manager
    - Head of
    - Director
    - VP

# Free text shown to the evaluator about relocation you would consider. Empty means the evaluator
# is given no relocation guidance and judges the role on its own merits.
relocation_note: ''

companies:
  # Companies to always auto-reject, whatever the posting says. Matched on an EXACT,
  # case-sensitive company name — 'acme' does not match 'Acme' — so list each variant a
  # company posts under. A name hit is then confirmed by one cheap LLM call, so a different
  # organization that happens to share the name is not rejected by mistake; if that call
  # cannot be made, the job is rejected on the name match alone.
  #
  # Also checked against the end client, so a recruiting agency reposting the role does not
  # get around it.
  #
  # `added` is required for an entry to expire. An entry stops rejecting 180 days after that
  # date and is then reported at WARNING and in the run audit log — renew it by bumping the
  # date, or delete it. An entry with no valid date stays active and is warned about.
  blacklist: []
  #   - name: Example Corp
  #     reason: bad Glassdoor reviews
  #     added: 2026-01-01

# ---------------------------------------------------------------------------
# run_dir/location_recommendations.yaml — written by the agent, ADVISORY ONLY
# ---------------------------------------------------------------------------
# Once per non-interactive run the agent compares the countries it actually saw against the two
# lists above and records what it would suggest, plus any list entry that looks ambiguous. It is
# NEVER read as policy and it never edits this file — an auto-reject is unappealable, so a
# recommendation waits until you act on it.
#
# To accept one: add the country to `exclude` or `hybrid.acceptable_locations` here yourself, then
# set `status: accepted` on that entry. To dismiss one: set `status: rejected`. Either way the
# agent stops asking. Countries you have not ruled on stay `pending` and are re-reported only when
# they are first written, so an unread backlog does not warn on every run.
