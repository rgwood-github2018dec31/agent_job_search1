[project]
name = "agentic-job-search"
version = "0.1.0"
description = "Autonomous job search agent built on the Claude Agent SDK"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "claude-agent-sdk>=0.2.139",
    # Imported directly by triage.py for the LLM tool-server sessions. It arrives transitively via
    # claude-agent-sdk, but an SDK release that drops or renames it would break us, so declare it.
    #
    # PINNED BELOW 2.0 DELIBERATELY. In mcp 2.0 `streamable_http_client` yields 2 values instead of
    # 3, so `mcp_session` in triage.py (`async with streamable_http_client(url) as (read, write, _)`)
    # raises "not enough values to unpack". That helper is the ONLY path to the OpenRouter and Ollama
    # tool servers, so a silent upgrade takes out Stage 2 triage, the non-Anthropic rating call, the
    # reference summary, and the OpenRouter extractor at once -- and only at runtime, mid-run.
    # Measured 2026-08-21: a bare `uv run` re-resolved `mcp>=1.29` to 2.0.0 and did exactly that.
    # Before lifting this, make mcp_session tolerate both arities and verify against a live server.
    "mcp>=1.29,<2",
    "requests>=2.34",
    "pypdf>=6.16.1",
    "pyyaml>=6.0",
    "rich>=15.0",
    "utils-tools-n-agents-common",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
]

[tool.uv.sources]
utils-tools-n-agents-common = { path = "../utils_tools_n_agents_common", editable = true }

[project.scripts]
job-search = "agentic_job_search.agent:cli"

[dependency-groups]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_job_search"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live_agent_claude: marks tests that require a live Claude API connection",
    "live: marks tests that require the local/remote LLM MCP tool servers to be running",
    "network: marks tests that reach a third-party network service (no local servers required)",
]

[tool.ruff]
# 99% of existing lines already fit; ruff's default of 88 flagged hundreds of lines as noise.
line-length = 120
