[project]
name = "agentic-job-search"
version = "0.1.0"
description = "Autonomous job search agent built on the Claude Agent SDK"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "claude-agent-sdk>=0.2.139",
    "requests>=2.34",
    "pypdf>=6.16.1",
    "pyyaml>=6.0",
    "rich>=15.0",
    "utils-tools-n-agents-common",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
]

[tool.uv.sources]
utils-tools-n-agents-common = { path = "../utils_tools_n_agents_common", editable = true }

[project.scripts]
job-search = "agentic_job_search.agent:cli"

[dependency-groups]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_job_search"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live_agent_claude: marks tests that require a live Claude API connection",
    "live: marks tests that require the local/remote LLM MCP tool servers to be running",
    "network: marks tests that reach a third-party network service (no local servers required)",
]

# Ruff config comes from the workspace ruff.toml one level up (lines are only reported
# above 160, so the old default-88 line-length noise is gone).
