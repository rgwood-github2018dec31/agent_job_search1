[project]
name = "agentic-job-search"
version = "0.1.0"
description = "Autonomous job search agent built on the Claude Agent SDK"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "claude-agent-sdk>=0.2.132",
    "requests>=2.34",
    "pypdf>=6.15",
    "pyyaml>=6.0",
    "rich>=15.0",
]

[project.scripts]
job-search = "agentic_job_search.agent:cli"

[dependency-groups]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_job_search"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live_agent_claude: marks tests that require a live Claude API connection",
    "live: marks tests that require the local/remote LLM MCP tool servers to be running",
]
